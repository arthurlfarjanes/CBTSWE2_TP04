<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD Produtos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 16px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main { max-width: 760px; margin: 0 auto; }
        h1 { text-align: center; font-weight: 600; margin: 0 0 24px; }
        form, .table-wrap {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
        }
        form { display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; }
        input[type="text"], input[type="number"] {
            flex: 1 1 160px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.15);
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            transition: background .15s, transform .05s;
        }
        button:hover { background: var(--primary-dark); }
        button:active { transform: scale(.97); }
        form button[type="button"] { background: var(--border); color: var(--text); }
        form button[type="button"]:hover { background: #d1d5db; }
        td button { padding: 6px 12px; font-size: 13px; margin-right: 4px; }
        td button:last-child { background: var(--danger); }
        td button:last-child:hover { background: #dc2626; }
        .table-wrap { margin-top: 24px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; }
        th {
            background: #f9fafb;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }
        tbody tr { border-top: 1px solid var(--border); }
        tbody tr:hover { background: #f9fafb; }
    </style>
</head>
<body>
    <main>
        <h1>Gerenciamento de Produtos</h1>

        <form id="productForm">
            <input type="hidden" id="productId">
            <input type="text" id="name" placeholder="Nome do Produto" required>
            <input type="number" id="price" placeholder="Preço" step="0.01" required>
            <button type="submit">Salvar</button>
            <button type="button" onclick="clearForm()">Cancelar</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const apiUrl = '/api/products';

        async function loadProducts() {
            const response = await fetch(apiUrl);
            const products = await response.json();
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.price}</td>
                        <td>
                            <button onclick="editProduct(${p.id}, '${p.name}', ${p.price})">Editar</button>
                            <button onclick="deleteProduct(${p.id})">Excluir</button>
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const product = {
                id: id ? parseInt(id) : 0,
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${apiUrl}/${id}` : apiUrl;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            });

            clearForm();
            loadProducts();
        });

        function editProduct(id, name, price) {
            document.getElementById('productId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('price').value = price;
        }

        async function deleteProduct(id) {
            if(confirm('Tem certeza?')) {
                await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                loadProducts();
            }
        }

        function clearForm() {
            document.getElementById('productId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
        }

        loadProducts();
    </script>
</body>
</html>
